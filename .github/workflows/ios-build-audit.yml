name: iOS build audit

on:
  push:
    branches:
      - fix-whatsapp-pdf-device-duplicates-20260728
    paths:
      - ".github/workflows/ios-build-audit.yml"
      - ".github/workflows/ios-testflight-release.yml"
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "tools/ios_testflight_release.sh"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout \
            --detach \
            6fba2447e95c451518584c35e25f5433f14d888c
          test "$(
            git -C "$RUNNER_TEMP/flutter" rev-parse HEAD
          )" = "6fba2447e95c451518584c35e25f5433f14d888c"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Validate iOS configuration
        shell: bash
        run: |
          plutil -lint ios/Runner/Info.plist
          ruby -c ios/Podfile
          grep -q "PERMISSION_CAMERA=1" ios/Podfile
          grep -q "PERMISSION_NOTIFICATIONS=1" ios/Podfile
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" ios/Runner/Info.plist
          ! /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" ios/Runner/Info.plist
          ! find ios -type f \( \
            -name "*.ipa" -o \
            -name "*.p12" -o \
            -name "*.p8" -o \
            -name "*.mobileprovision" \
          \) | grep -q .
          ! grep -R -E \
            "^[[:space:]]*-----BEGIN ((EC )?PRIVATE KEY|CERTIFICATE)-----" \
            ios iphone tools .github
          bash -n tools/ios_testflight_release.sh
          ruby -e "
            require 'yaml'
            YAML.safe_load_file(
              '.github/workflows/ios-testflight-release.yml',
              permitted_classes: [],
              aliases: false,
            )
          "

      - name: Resolve dependencies
        shell: bash
        run: |
          flutter config --no-analytics
          flutter precache --ios
          flutter pub get

      - name: Run automated tests
        run: flutter test

      - name: Build unsigned iPhone release for audit
        run: flutter build ios --release --no-codesign

      - name: Inspect audit build
        shell: bash
        run: |
          test -d build/ios/iphoneos/Runner.app
          test ! -e build/ios/iphoneos/Runner.app/embedded.mobileprovision
          plutil -lint build/ios/iphoneos/Runner.app/Info.plist
          app_plist="build/ios/iphoneos/Runner.app/Info.plist"
          display_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$app_plist")
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app_plist")
          version_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app_plist")
          version_code=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app_plist")
          printf 'Display name: %s\nBundle: %s\nVersion: %s (%s)\n' \
            "$display_name" "$bundle_id" "$version_name" "$version_code"
          test "$display_name" = "مساعد الصيانة"
          test "$bundle_id" = "com.proshop.mobileShopPro"
          test "$version_name" = "1.0.1"
          test "$version_code" = "2"
