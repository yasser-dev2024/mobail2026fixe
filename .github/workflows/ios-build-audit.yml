name: iOS build audit

on:
  push:
    branches:
      - fix-whatsapp-pdf-device-duplicates-20260728
    paths:
      - ".github/workflows/ios-build-audit.yml"
      - "ios/**"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone \
            --branch 3.32.4 \
            --depth 1 \
            https://github.com/flutter/flutter.git \
            "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Validate iOS configuration
        shell: bash
        run: |
          plutil -lint ios/Runner/Info.plist
          ruby -c ios/Podfile
          grep -q "PERMISSION_CAMERA=1" ios/Podfile
          grep -q "PERMISSION_NOTIFICATIONS=1" ios/Podfile

      - name: Resolve dependencies
        shell: bash
        run: |
          flutter config --no-analytics
          flutter precache --ios
          flutter pub get

      - name: Run automated tests
        run: flutter test

      - name: Build unsigned iPhone release for audit
        run: flutter build ios --release --no-codesign

      - name: Inspect audit build
        shell: bash
        run: |
          test -d build/ios/iphoneos/Runner.app
          test ! -e build/ios/iphoneos/Runner.app/embedded.mobileprovision
          plutil -lint build/ios/iphoneos/Runner.app/Info.plist
          test "$(defaults read "$PWD/build/ios/iphoneos/Runner.app/Info" CFBundleDisplayName)" = "مساعد الصيانة"
